name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        run: ./mvnw clean install
      - name: Verify benchmark compiles
        run: ./mvnw compile -Pbenchmark -pl benchmark

  windows-test:
    runs-on: windows-latest
    name: windows tests

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build dependencies
        run: .\mvnw.cmd -q -pl aesh -am -DskipTests install
      - name: Test builtins
        run: .\mvnw.cmd -pl aesh-builtins test
      - name: Test shell escape
        run: .\mvnw.cmd -pl aesh test -Dtest='NativeExecutionTest,ShellEscapeTest' -DfailIfNoTests=false

  windows-augmentation-mimic:
    runs-on: windows-latest
    name: windows augmentation mimic (#686)

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build test classes
        shell: bash
        run: ./mvnw -q -pl aesh -am -DskipTests install
      - name: Run headless parallel-augmentation mimic
        shell: bash
        timeout-minutes: 25
        run: |
          ./mvnw -q -pl aesh dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/mimic-cp.txt" -DincludeScope=test
          CP="aesh/target/test-classes;aesh/target/classes;$(cat "$RUNNER_TEMP/mimic-cp.txt")"
          for i in 1 2 3 4 5; do
            echo "=== attempt $i/5 ==="
            java -cp "$CP" org.aesh.command.QuarkusForkMimic || exit 1
          done
          echo "MIMIC ALL GREEN"

  native-test:
    runs-on: ubuntu-latest
    name: native-image smoke test

    steps:
      - uses: actions/checkout@v7
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Build aesh
        run: ./mvnw clean install -DskipTests
      - name: Build examples
        run: ./mvnw package -Pexamples -pl examples -DskipTests
      - name: Build native image
        run: |
          # Use the shaded fat jar (exclude -javadoc, -sources, -tests JARs)
          JAR=$(ls examples/target/aesh-examples-*.jar | grep -v javadoc | grep -v sources | grep -v tests | head -1)
          echo "Using JAR: $JAR"
          native-image \
            -cp "$JAR" \
            examples.NewFeaturesExample \
            -o /tmp/aesh-native-test \
            --no-fallback -march=compatibility
      - name: Smoke test native image
        run: |
          OUTPUT=$(printf 'build --target release\nsleep 1\nexit\n' | \
            timeout 15 /tmp/aesh-native-test 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Build complete" || \
            (echo "FAIL: 'Build complete' not found" && exit 1)
          echo "$OUTPUT" | grep -q "Done" || \
            (echo "FAIL: 'Done' not found (sleep command)" && exit 1)
          echo "Native smoke test PASSED"
