version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # The Maven distribution itself is pinned via the wrapper
    # (.mvn/wrapper/maven-wrapper.properties) — 3.10 breaks the Central
    # Sonatype deploy, so never bump it via Dependabot.
    ignore:
      - dependency-name: "org.apache.maven:apache-maven"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
